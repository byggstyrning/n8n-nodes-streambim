# Publishes the package to npm when a version tag (v1.2.3) is pushed.
#
# n8n requires community nodes to be published from GitHub Actions with an npm
# provenance statement, which proves the package was built by this workflow from
# this repository and commit. npm only issues provenance for public repositories
# on GitHub-hosted runners.
#
# One-time setup on npmjs.com (package settings -> Trusted publishing):
#   Publisher: GitHub Actions, owner "byggstyrning", repository
#   "n8n-nodes-streambim", workflow "publish.yml", no environment.
# npm then accepts this workflow's OIDC token; no NPM_TOKEN secret is needed.
# (Fallback: a granular npm token in the NPM_TOKEN secret also works.)

name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Use an npm that supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi

      - run: pnpm test

      - name: Publish (prepublishOnly builds and runs the prepublish lint)
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
